<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table Not Found | Spice Haven</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .not-found-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }
    .not-found-num {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 700;
      color: var(--color-primary);
      line-height: 1;
      text-shadow: 0 4px 30px rgba(229, 169, 60, 0.3);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="not-found-wrap">
    <div class="brand-crest" style="margin-bottom: 24px; width: 48px; height: 48px; font-size: 1.5rem;">S</div>
    <div class="not-found-num">404</div>
    <span class="section-tag">Sanctuary Uncharted</span>
    <h1 style="font-size: clamp(1.8rem, 3.5vw, 2.6rem); margin: 12px 0 16px 0;">This Table is Not in Service</h1>
    <p style="max-width: 480px; margin: 0 auto 32px auto; color: var(--text-muted);">
      The culinary page or tasting reservation you requested does not exist or has been relocated to our private cellar archive.
    </p>
    <a href="index.html" class="btn btn-primary-gold btn-lg">
      Return to Grand Dining Hall
    </a>
  </div>
</body>
</html>
